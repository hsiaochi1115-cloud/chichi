<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f4">
<title>臨床技能中心｜教具借用</title>
<style>
:root{--ink:#193a33;--green:#26715c;--muted:#697a74;--line:#dce6df;--bg:#f5f7f4;--mint:#e9f3ed;--gold:#dcad5b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.top{height:64px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:#fff}.brand{font-size:14px;font-weight:700;letter-spacing:.08em}.brand span{color:var(--green)}.hero{padding:43px 0 27px;display:flex;justify-content:space-between;gap:24px;align-items:flex-end}.kicker{font-size:12px;letter-spacing:.13em;font-weight:800;color:var(--green)}h1{font-size:clamp(32px,4.6vw,49px);line-height:1.18;letter-spacing:-.04em;margin:10px 0}.hero p{margin:0;color:var(--muted);max-width:670px}.pdf{white-space:nowrap;color:var(--green);font-size:13px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:white;padding:10px 14px;border-radius:10px}.pdf:hover{background:var(--mint)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:18px 0 14px}.section-head h2{font-size:21px;margin:0}.section-head p{font-size:13px;color:var(--muted);margin:3px 0 0}.tools{display:flex;gap:10px;width:min(440px,100%)}input,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;background:#fff;color:var(--ink)}input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #26715c15}.tools input{width:100%}.count{font-size:13px;color:var(--muted);white-space:nowrap;align-self:center}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px #17352a12}.photo{height:160px;background:#fff;display:grid;place-items:center;border-bottom:1px solid #eef1ed;padding:8px}.photo img{width:100%;height:100%;object-fit:contain}.card-body{padding:12px 13px 13px}.num{font-size:11px;color:#75847d;letter-spacing:.08em}.card h3{font-size:14px;line-height:1.45;margin:4px 0 5px;min-height:40px}.qty{font-size:12px;color:var(--muted)}.pick{width:100%;margin-top:10px;padding:8px;border:0;border-radius:8px;background:var(--mint);color:var(--green);font-weight:750;cursor:pointer}.pick:hover,.pick.selected{background:var(--green);color:#fff}.formpanel{margin:36px 0 50px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:24px}.formpanel h2{font-size:21px;margin:0}.formpanel .lead{font-size:13px;color:var(--muted);margin:4px 0 18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:700;color:#38594f}.field input,.field textarea{width:100%;font-size:14px}.field textarea{min-height:75px;resize:vertical}.actions{grid-column:1/-1;display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:9px;padding:11px 16px;background:var(--green);color:white;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:var(--mint);color:var(--green)}.notice{font-size:12px;color:var(--muted);margin:11px 0 0}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:10px;background:var(--mint);white-space:pre-wrap;font-size:13px;color:#244f40}.result.show{display:block}.footer{border-top:1px solid var(--line);padding:17px 0 30px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.footer a{color:var(--green)}@media(max-width:850px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:610px){.hero{display:block;padding-top:34px}.pdf{display:inline-block;margin-top:17px}.section-head{align-items:flex-start;flex-direction:column}.tools{width:100%}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:130px}.card h3{min-height:0}.formpanel{padding:18px}.formgrid{grid-template-columns:1fr}.field.full,.actions{grid-column:auto}.footer{flex-direction:column}}
</style></head>
<body><header class="top"><div class="wrap brand"><span>臨床技能中心</span>　/　教具借用服務</div></header>
<main class="wrap"><section class="hero"><div><div class="kicker">STAFF EQUIPMENT LOAN</div><h1>找到教具，<br>開始申請借用。</h1><p>瀏覽中心教具照片，搜尋品項後加入申請。實際可借數量與檔期請以中心承辦人確認為準。</p></div><a class="pdf" href="臨床技能中心教具.pdf" target="_blank" rel="noopener">開啟原始教具清單 PDF ↗</a></section>
<section><div class="section-head"><div><h2>教具目錄</h2><p>點選「加入申請」即可帶入品項名稱</p></div><div class="tools"><input id="search" type="search" placeholder="搜尋教具名稱…" aria-label="搜尋教具"><span class="count" id="count"></span></div></div><div class="cards" id="cards"></div></section>
<section class="formpanel" id="request"><h2>借用申請</h2><p class="lead">填寫資料後產生申請文字，複製並交給中心承辦人確認。</p><form id="loanForm" class="formgrid"><div class="field"><label for="name">申請人姓名 *</label><input id="name" required placeholder="請輸入姓名"></div><div class="field"><label for="unit">單位／病房 *</label><input id="unit" required placeholder="例如：內科病房"></div><div class="field full"><label for="item">申請教具 *</label><textarea id="item" required placeholder="從上方教具目錄選擇，或輸入教具名稱與數量"></textarea></div><div class="field"><label for="start">借用日期 *</label><input id="start" type="date" required></div><div class="field"><label for="end">預計歸還日期 *</label><input id="end" type="date" required></div><div class="field full"><label for="purpose">用途／備註</label><textarea id="purpose" placeholder="教學、訓練或其他需求"></textarea></div><div class="actions"><button class="btn" type="submit">產生申請內容</button><button class="btn alt" id="copyBtn" type="button" disabled>複製申請內容</button></div></form><div class="result" id="result" aria-live="polite"></div><p class="notice">申請資料只在此頁面暫時使用，不會自動送出或保存。請複製後交由中心承辦人確認。</p></section>
<footer class="footer"><span>臨床技能中心・教具借用</span><span>資料來源：<a href="臨床技能中心教具.pdf" target="_blank" rel="noopener">中心教具清單</a></span></footer></main>
<script>
const items=[
['褥瘡／燙傷傷口模型',2],['導尿管置放模型',3],['傷口縫合模型',7],['氣胸訓練模型',1],['下肢穿刺模擬訓練模型',1],['脊椎穿刺模型',1],['氣管插管練習模型',3],['嬰兒氣道處理訓練模型',2],['鼻胃管置入練習模型',2],['靜脈軟針置入練習模型',3],['婦科內診檢查模型（子宮頸抹片篩檢操作）',2],['基本救命術（BLS）模型',1],['簡易燈號成人半身 CPR 模型',2],['半身中央及周邊靜脈導管照護模型',2],['皮下注射模型',2],['肌肉注射模型',2],['眼底鏡病變判讀模型',1],['耳道病變判讀模型',1],['Mr Hurt Trauma Head',2],['CVC 穿刺插入模擬裝置模型',1],['半身中央靜脈訓練模型',1],['高級心臟救命術訓練模型',1],['電子式動脈採血手臂',2],['成人呼吸音及心音聽診練習模型',1],['嬰兒',1],['哽塞娃娃',1],['簡易嬰兒 QCPR',2],['新生兒急救模組',1],['5 歲兒童護理假病人',1],['耳朵檢查模型',1],['肛門指診檢查模型',1],['乳房觸診模型',1],['氣道處理模型',1],['局部麻醉超音波穿刺訓練仿體',2],['行動訓練監護儀',2,'組'],['超音波影像儀',2,'台']
];
const cards=document.getElementById('cards'), search=document.getElementById('search'), count=document.getElementById('count'), itemField=document.getElementById('item');
function draw(){const q=search.value.trim().toLocaleLowerCase();const filtered=items.map((x,i)=>({...x,index:i})).filter(x=>x[0].toLocaleLowerCase().includes(q));count.textContent=`${filtered.length} / ${items.length} 項`;cards.innerHTML=filtered.map(x=>`<article class="card"><div class="photo"><img loading="lazy" src="images/教具-${String(x.index+1).padStart(2,'0')}.png" alt="${x[0]}照片"></div><div class="card-body"><div class="num">ITEM ${String(x.index+1).padStart(2,'0')}</div><h3>${x[0]}</h3><div class="qty">清單數量：${x[1]} ${x[2]||'具'}</div><button class="pick" type="button" data-index="${x.index}">加入申請</button></div></article>`).join('');cards.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>{const x=items[Number(b.dataset.index)];const line=`${x[0]} × ${x[1]} ${x[2]||'具'}`;const lines=itemField.value.split('\n').filter(Boolean);if(!lines.includes(line))lines.push(line);itemField.value=lines.join('\n');b.classList.add('selected');b.textContent='已加入 ✓';document.getElementById('request').scrollIntoView({behavior:'smooth',block:'nearest'})}))}
search.addEventListener('input',draw);draw();
const form=document.getElementById('loanForm'),result=document.getElementById('result'),copyBtn=document.getElementById('copyBtn');let requestText='';
form.addEventListener('submit',e=>{e.preventDefault();if(document.getElementById('end').value<document.getElementById('start').value){result.textContent='歸還日期需與借用日期相同或晚於借用日期。';result.classList.add('show');return}const v=id=>document.getElementById(id).value.trim();requestText=`臨床技能中心教具借用申請\n申請人：${v('name')}\n單位／病房：${v('unit')}\n申請教具：\n${v('item')}\n借用日期：${v('start')}\n預計歸還日期：${v('end')}\n用途／備註：${v('purpose')||'無'}`;result.textContent=requestText;result.classList.add('show');copyBtn.disabled=false});
copyBtn.addEventListener('click',async()=>{if(!requestText)return;try{await navigator.clipboard.writeText(requestText)}catch{const t=document.createElement('textarea');t.value=requestText;document.body.append(t);t.select();document.execCommand('copy');t.remove()}copyBtn.textContent='已複製 ✓';setTimeout(()=>copyBtn.textContent='複製申請內容',1800)});
</script></body></html>
